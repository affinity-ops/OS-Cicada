# EAKF Kubernetes Manifests — gVisor Isolation (Standard Tier)
#
# This manifest deploys the eakfd daemon as a Kubernetes Deployment
# using the gVisor RuntimeClass for user-space kernel isolation.
#
# Prerequisites:
#   - gVisor (runsc) installed on cluster nodes
#   - RuntimeClass "gvisor" registered (included below)
#
# Enterprise upgrade: Replace runtimeClassName with "kata" for
# Firecracker-backed microVM isolation (see eakf-kata.yaml).

---
# RuntimeClass — registers gVisor as an available runtime
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc

---
# eakfd Deployment — gVisor-isolated sandbox daemon
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eakfd
  namespace: cicada
  labels:
    app.kubernetes.io/name: eakfd
    app.kubernetes.io/component: sandbox
    app.kubernetes.io/part-of: cicada
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eakfd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eakfd
        app.kubernetes.io/component: sandbox
    spec:
      runtimeClassName: gvisor                    # gVisor user-space kernel
      serviceAccountName: eakfd
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eakfd
          image: cicada/eakfd:latest
          env:
            - name: EAKF_SOCKET_PATH
              value: /var/run/cicada/eakf.sock
          volumeMounts:
            - name: eakf-socket
              mountPath: /var/run/cicada
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=unix:///var/run/cicada/eakf.sock
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=unix:///var/run/cicada/eakf.sock
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: eakf-socket
          emptyDir:
            medium: Memory                        # RAM-backed for low-latency UDS
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

---
# ServiceAccount for eakfd — minimal RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eakfd
  namespace: cicada
  labels:
    app.kubernetes.io/name: eakfd

---
# Sentry Gateway patch — mount shared socket volume and enable EAKF plugin
# Apply this as a strategic merge patch to the existing sentry-gateway Deployment:
