# ─── Cicada Platform — Production Docker Compose ─────────────────────────
#
# Runtime: Colima VM (macOS)
#   Start Colima:  colima start --cpu 4 --memory 8 --disk 60
#   Deploy:        docker compose -f docker-compose.prod.yml up -d --build
#   Teardown:      docker compose -f docker-compose.prod.yml down -v
#
# Port map:
#   PostgreSQL  → 5432
#   Redis       → 6379
#   Core API    → 8000
#   Sentry GW   → 8080
#   Dashboard   → 3000
#   Dev Portal  → 3001
#   GW Portal   → 3002
#   Landing     → 3003
# ──────────────────────────────────────────────────────────────────────────

services:

  # ─── Infrastructure ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cicada_ledger
      POSTGRES_USER: cicada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cicada_dev_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicada -d cicada_ledger"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Core API (Laravel) ────────────────────────────────────────────────
  core-api:
    build:
      context: ./Core_API
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cicada_ledger
      DB_USERNAME: cicada
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cicada_dev_pw}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3001
      GATEWAY_PORTAL_URL: http://localhost:3002
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── EAKF Daemon (gVisor-isolated sandbox) ─────────────────────────────
  # Runs the code execution sandbox inside a gVisor user-space kernel.
  # Same isolation technology as Google Cloud Run.
  # Enterprise: swap runtime to Kata Containers for Firecracker microVMs.
  eakfd:
    build:
      context: ./Sentry_Gateway
      dockerfile: Dockerfile.eakfd
    runtime: runsc
    restart: unless-stopped
    environment:
      EAKF_SOCKET_PATH: /var/run/cicada/eakf.sock
    volumes:
      - eakf_socket:/var/run/cicada
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256M,noexec
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr", "unix:///var/run/cicada/eakf.sock"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Sentry Gateway (Go) ──────────────────────────────────────────────
  sentry-gateway:
    build:
      context: ./Sentry_Gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CICADA_API_URL: http://core-api:8000
      CICADA_REDIS_URL: redis://redis:6379
      CICADA_DB_URL: postgres://cicada:${POSTGRES_PASSWORD:-cicada_dev_pw}@postgres:5432/cicada_ledger?sslmode=disable
      CICADA_PLUGINS: eakf
      EAKF_SOCKET_PATH: /var/run/cicada/eakf.sock
    volumes:
      - eakf_socket:/var/run/cicada
    depends_on:
      core-api:
        condition: service_started
      redis:
        condition: service_healthy
      eakfd:
        condition: service_healthy

  # ─── Operator Dashboard (Next.js :3000) ────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CORE_API_URL: http://localhost:8000
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080

  # ─── Developer Portal (Next.js :3001) ──────────────────────────────────
  developer-portal:
    build:
      context: ./Developer_Portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_CORE_API_URL: http://localhost:8000

  # ─── Gateway Portal (Next.js :3002) ────────────────────────────────────
  gateway-portal:
    build:
      context: ./Gateway_Portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_CORE_API_URL: http://localhost:8000

  # ─── Saga Executor (Python worker) ─────────────────────────────────────
  saga-executor:
    build:
      context: ./Saga_Executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CICADA_API_URL: http://core-api:8000
      CICADA_REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://cicada:${POSTGRES_PASSWORD:-cicada_dev_pw}@postgres:5432/cicada_ledger?sslmode=disable
    depends_on:
      core-api:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
  eakf_socket:
