# Cicada Platform — Docker Compose (Production-Ready)
#
# Usage:
#   1. Run ./scripts/validate-env.sh first
#   2. docker compose up -d
#   3. docker compose exec core-api php artisan migrate
#   4. docker compose exec core-api php artisan operator:create --email=admin@cicada.io
#
# For development, override with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cicada_platform
      POSTGRES_USER: cicada
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cicada_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicada -d cicada_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-cicada_redis}
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cicada_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Core API (Laravel) ──────────────────────────────────
  core-api:
    build:
      context: ./Core_API
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./Core_API/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── EAKF Daemon (gVisor-isolated sandbox) ────────────────
  # In bare-metal Linux production with gVisor installed, uncomment
  # `runtime: runsc` (or use docker-compose.prod.yml) for user-space
  # kernel syscall interception.
  #
  # The daemon communicates with the Sentry Gateway over a shared
  # UNIX Domain Socket volume — no TCP exposure.
  #
  # See: EPHEMERAL_AGENT_KERNEL_FIREWALL.md §7
  eakfd:
    build:
      context: ./Sentry_Gateway
      dockerfile: Dockerfile.eakfd
    # runtime: runsc                      # Uncomment on Linux hosts with gVisor (runsc) installed
    restart: unless-stopped
    environment:
      EAKF_SOCKET_PATH: /var/run/cicada/eakf.sock
    volumes:
      - eakf_socket:/var/run/cicada       # Shared UDS volume with gateway
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256M,noexec             # Writable scratch space for payloads
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr", "unix:///var/run/cicada/eakf.sock"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Sentry Gateway (Go) ────────────────────────────────
  sentry-gateway:
    build:
      context: ./Sentry_Gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-api:
        condition: service_healthy
      eakfd:
        condition: service_healthy
    environment:
      PORT: "8080"
      CICADA_DEV_MODE: ${CICADA_DEV_MODE:-true}
      CICADA_AES_MASTER_KEY: ${CICADA_AES_MASTER_KEY:-0123456789abcdef0123456789abcdef}
      CICADA_POSTGRES_URL: postgres://cicada:${DB_PASSWORD:-cicada_secret}@postgres:5432/cicada_platform?sslmode=disable
      DATABASE_URL: postgres://cicada:${DB_PASSWORD:-cicada_secret}@postgres:5432/cicada_platform?sslmode=disable
      CICADA_REDIS_URL: redis://:${REDIS_PASSWORD:-cicada_redis}@redis:6379
      REDIS_URL: redis://:${REDIS_PASSWORD:-cicada_redis}@redis:6379
      CICADA_CORE_API_URL: http://core-api:8000
      CICADA_KEY_PATH: /data/sentry_ed25519.key
      CICADA_INTERNAL_KEY: ${GATEWAY_INTERNAL_KEY:-}
      CICADA_PLUGINS: eakf                # Register EAKF plugin at boot
      EAKF_SOCKET_PATH: /var/run/cicada/eakf.sock
    volumes:
      - gateway_data:/data               # Ed25519 key + edge ledger persistence
      - eakf_socket:/var/run/cicada      # Shared UDS volume with eakfd
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Operator Dashboard ──────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_CORE_API_URL: ${DASHBOARD_API_URL:-http://core-api:8000}
      NEXT_PUBLIC_OPERATOR_KEY: ${OPERATOR_API_KEY:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Cicada Aegis Operator}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"

  # ── Developer Portal ────────────────────────────────────
  developer-portal:
    build:
      context: ./Developer_Portal
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_CORE_API_URL: ${PORTAL_API_URL:-http://core-api:8000}
    ports:
      - "3001:3001"

  # ── Gateway Portal ──────────────────────────────────────
  gateway-portal:
    build:
      context: ./Gateway_Portal
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_CORE_API_URL: ${GATEWAY_API_URL:-http://core-api:8000}
    ports:
      - "3002:3002"

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  gateway_data:
    driver: local          # Persists Ed25519 key and edge ledger across restarts
  eakf_socket:
    driver: local          # Shared UDS between eakfd and sentry-gateway
