[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cicada-guard"
version = "0.2.0"
description = "Python SDK for the Cicada AI Agent Governance Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Cicada Platform Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai", "agent", "security", "governance", "cicada", "llm", "guardrails"]

dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
]

[project.scripts]
cicada = "cicada_guard.cli:main"

[project.optional-dependencies]
schema = ["jsonschema>=4.17.0"]
langchain = ["langchain-core>=0.1.0"]
crewai = ["crewai>=0.1.0"]
all = [
    "jsonschema>=4.17.0",
    "langchain-core>=0.1.0",
    "crewai>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://cicada.dev"
Documentation = "https://docs.cicada.dev/sdk/python"
Repository = "https://github.com/cicada-platform/cicada-guard"
Homebrew = "https://github.com/cicada-platform/homebrew-cicada"

[tool.setuptools.packages.find]
include = ["cicada_guard*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
