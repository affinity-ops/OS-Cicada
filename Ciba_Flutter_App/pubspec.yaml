name: aegis_ciba_companion
description: "Cicada Aegis — Zero-Trust HITL Companion"
publish_to: 'none'
version: 3.0.0+5

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Crypto ──────────────────────────────────────────────────────────────────
  cryptography: ^2.9.0            # Ed25519, X25519
  flutter_secure_storage: ^10.0.0 # Secure Enclave / Keystore

  # ── Biometrics ──────────────────────────────────────────────────────────────
  local_auth: ^2.3.0              # BiometricPrompt / LAContext

  # ── Networking ──────────────────────────────────────────────────────────────
  dio: ^5.9.2                     # HTTP client

  # ── State Management ───────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1            # BLoC pattern

  # ── UI ──────────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1            # Space Grotesk, Manrope, JetBrains Mono
  shimmer: ^3.0.0                 # Loading skeletons

  # ── QR ──────────────────────────────────────────────────────────────────────
  mobile_scanner: ^7.2.0          # QR scanning

  # ── Platform Info ───────────────────────────────────────────────────────────
  device_info_plus: ^12.4.0       # Device telemetry

  # ── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # ── Alerts ──────────────────────────────────────────────────────────────────
  flutter_soloud: ^3.0.0            # Emergency siren (custom WAV)

  # ── Offline / Storage ──────────────────────────────────────────────────────
  sqflite: ^2.4.2                 # SQLite for offline decision queue
  path_provider: ^2.1.5           # Database file path
  connectivity_plus: ^6.1.4       # Offline detection

  # ── Utilities ───────────────────────────────────────────────────────────────
  intl: ^0.20.2                   # Date formatting
  http: ^1.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
